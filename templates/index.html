<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🔐 Caesar Cipher</h1>

        <form method="POST">
            <textarea name="text" placeholder="Enter your message..." required></textarea>

            <div class="controls">
                <input type="number" name="shift" placeholder="Shift (e.g. 3)" required>

                <select name="mode">
                    <option value="encrypt">Encrypt</option>
                    <option value="decrypt">Decrypt</option>
                </select>
            </div>

            <button type="submit">Process</button>
        </form>

        {% if output %}
        <div class="output-box">
            <h3>Result</h3>
            <p>{{ output }}</p>
        </div>
        {% endif %}
    </div>
</div>

</body>
</html>
